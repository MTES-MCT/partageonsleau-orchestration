name: Deploy (testing) to Scaleway

on:
  push:
    branches: ["testing"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testing-orchestration
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      SCW_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      SCW_TESTING_PRIVATE_NETWORK_ID: ${{ vars.SCW_TESTING_PRIVATE_NETWORK_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate testing CI configuration
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONFIGURED_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_CONFIGURED_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONFIGURED_CONTAINER_ID: ${{ secrets.SCW_TESTING_CONTAINER_ID }}
        run: |
          set -euo pipefail
          test -n "$SCW_TESTING_PRIVATE_NETWORK_ID"
          node .github/scripts/deploy-container.mjs --check testing

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Install Scaleway CLI
        run: bash .github/scripts/install-scw.sh

      - name: Validate Scaleway testing resource ownership
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: |
          set -euo pipefail
          namespace="$(scw container namespace get "$SCW_NAMESPACE_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.project_id' <<< "$namespace")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$namespace")" == "$SCW_NAMESPACE_NAME" ]] || {
            echo "::error::Unexpected testing namespace"
            exit 1
          }
          network="$(scw vpc private-network get "$SCW_TESTING_PRIVATE_NETWORK_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.project_id' <<< "$network")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$network")" == "partageonsleau-testing-pn" \
            && "$(jq -er '.region' <<< "$network")" == "$SCW_REGION" ]] || {
            echo "::error::Unexpected testing private network"
            exit 1
          }
          container="$(scw container container get "$SCW_CONTAINER_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.name' <<< "$container")" == "$SCW_CONTAINER_NAME" \
            && "$(jq -er '.namespace_id' <<< "$container")" == "$SCW_NAMESPACE_ID" ]] || {
            echo "::error::Unexpected testing orchestration container"
            exit 1
          }
          for key in REDIS_URL PLE_WEBHOOK_SECRET CLIENT_SECRET SENTRY_DSN \
            BULLBOARD_PASSWORD WILLIE_API_TOKEN ORANGE_LIVE_OBJECTS_API_KEY; do
            jq -e -s --arg key "$key" '
              any(.[];
                ((.secret_environment_variables // {}) | has($key)) or
                ((.environment_variables[$key] // "") | length > 0)
              )
            ' <(printf '%s' "$namespace") <(printf '%s' "$container") >/dev/null || {
              echo "::error::Missing orchestration configuration: $key"
              exit 1
            }
          done

          tls_identity="$(jq -er '.environment_variables.REDIS_TLS_IDENTITY // .environment_variables.REDIS_HOST_OVERRIDE // empty' <<< "$container")"
          TLS_CERT_IDENTITY="$tls_identity" node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {X509Certificate} from 'node:crypto'
          import {readFileSync} from 'node:fs'
          import {getRedisTlsOptions} from './src/queues/redis-url.ts'
          const pem = readFileSync('deploy/certs/testing/redis-ca.pem', 'utf8')
          // The deployed Redis URL is write-only. Runtime validates its real scheme.
          const options = getRedisTlsOptions(pem, {
            REDIS_URL: 'rediss://localhost',
            REDIS_TLS_IDENTITY: process.env.TLS_CERT_IDENTITY,
          })
          assert.ok(options?.checkServerIdentity, 'Missing Redis certificate identity')
          const certificates = [...pem.matchAll(/-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/g)]
            .map(([value]) => new X509Certificate(value))
          assert.ok(certificates.length, 'Missing Redis certificates')
          for (const certificate of certificates) {
            assert.ok(Date.parse(certificate.validFrom) <= Date.now(), 'Redis certificate not yet valid')
            assert.ok(Date.parse(certificate.validTo) > Date.now() + 86_400_000, 'Redis certificate expires too soon')
          }
          assert.ok(certificates.some(certificate => !options.checkServerIdentity('', certificate.toLegacyObject())), 'Redis certificate identity mismatch')
          NODE
          openssl verify -CAfile deploy/certs/testing/redis-ca.pem deploy/certs/testing/redis-ca.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push testing image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          build-args: |
            ENV_NAME=testing
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-${{ github.sha }}
          cache-from: type=gha,scope=orchestration-testing
          cache-to: type=gha,mode=max,scope=orchestration-testing


      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan exact candidate image before any deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          bash .github/scripts/scan-image.sh "$IMAGE_REF"
          bash .github/scripts/smoke-image.sh "$IMAGE_REF"

      - name: Retain image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ github.run_id }}
          path: .artifacts/security/image-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy immutable testing image
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: |
          set -euo pipefail
          # Deployment changes the image only. Existing networking and configuration
          # must already match testing; never rebuild a partial environment map.
          current="$(scw container container get "$SCW_CONTAINER_ID" region="$SCW_REGION" -o json)"
          jq -e --arg name "$SCW_CONTAINER_NAME" --arg namespace "$SCW_NAMESPACE_ID" --arg network "$SCW_TESTING_PRIVATE_NETWORK_ID" '
            .name == $name
            and .namespace_id == $namespace
            and .private_network_id == $network
            and .environment_variables.REDIS_TLS_CA_FILE_PATH == "/usr/local/share/ca-certificates/scw-redis-ca.crt"
            and (.environment_variables.CLIENT_ID | startswith("sa_"))
            and (.environment_variables.PLE_BASE_URL | startswith("https://"))
          ' <<< "$current" >/dev/null || {
            echo "::error::Existing testing configuration is inconsistent; no configuration will be rewritten"
            exit 1
          }
          node .github/scripts/deploy-container.mjs "$SCW_CONTAINER_ID" /health

      - name: Publish testing tag after successful deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          TESTING_IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing
        run: docker buildx imagetools create --tag "$TESTING_IMAGE_REF" "$IMAGE_REF"
