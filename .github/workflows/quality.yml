name: Quality and security

on:
  pull_request:
    branches: [testing, demo, prod]
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Dependency and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Test deployment safeguards
        run: |
          for script in .github/scripts/*.mjs; do node --check "$script"; done
          node --test .github/scripts/deployment-policy.test.mjs
      - name: Audit all dependencies
        run: |
          set -o pipefail
          mkdir -p .artifacts/security
          npm audit --include=dev --audit-level=low --json | tee .artifacts/security/npm-audit-all.json
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p .artifacts/security
          npm audit --omit=dev --audit-level=low --json | tee .artifacts/security/npm-audit-production.json
      - name: Validate workflows and shell scripts
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-workflows.sh
      - name: Retain audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audits
          path: .artifacts/security/
          if-no-files-found: warn
          retention-days: 30

  tests:
    name: Orchestration quality, imports and queue compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/1
      QUEUE_INTEGRATION_TESTS: '1'
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
