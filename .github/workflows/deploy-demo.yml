name: Deploy (demo) to Scaleway

on:
  push:
    branches: ["demo"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo-orchestration
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    env:
      SCW_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      SCW_DEMO_REGISTRY_NAMESPACE_ID: 6b7c0bcc-999b-41a8-a790-59691dce2707
      SCW_DEMO_PRIVATE_NETWORK_ID: a600027e-6936-4538-acd7-3f2860113fc3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate demo CI configuration
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONFIGURED_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_CONFIGURED_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-container.mjs --check demo

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Check demo Redis certificate
        run: |
          set -euo pipefail

          certificate=deploy/certs/demo/redis-ca.pem
          test -s "$certificate" || {
            echo "::error::Missing $certificate"
            exit 1
          }
          openssl x509 -in "$certificate" -noout -checkend 86400
          openssl verify -CAfile "$certificate" "$certificate"
          openssl x509 \
            -in "$certificate" \
            -noout \
            -ext subjectAltName \
            | grep -F "IP Address:172.16.12.3"

      - name: Install Scaleway CLI
        run: bash .github/scripts/install-scw.sh

      - name: Validate Scaleway demo resource ownership
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ env.SCW_EXPECTED_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ env.SCW_EXPECTED_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: |
          set -euo pipefail

          namespace="$(scw container namespace get "$SCW_NAMESPACE_ID" \
            region="$SCW_REGION" \
            -o json)"
          [[ "$(jq -er '.project_id' <<< "$namespace")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$namespace")" == "$SCW_NAMESPACE_NAME" ]] || {
            echo "::error::Unexpected demo namespace"
            exit 1
          }

          private_network="$(scw vpc private-network get "$SCW_DEMO_PRIVATE_NETWORK_ID" \
            region="$SCW_REGION" \
            -o json)"
          [[ "$(jq -er '.project_id' <<< "$private_network")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$private_network")" == "partageonsleau-demo-pn" \
            && "$(jq -er '.region' <<< "$private_network")" == "$SCW_REGION" ]] || {
            echo "::error::Unexpected demo private network"
            exit 1
          }

          registry_namespace="$(scw registry namespace get "$SCW_DEMO_REGISTRY_NAMESPACE_ID" \
            region="$SCW_REGION" \
            -o json)"
          [[ "$(jq -er '.project_id' <<< "$registry_namespace")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$registry_namespace")" == "partageonsleau-orchestration" \
            && "$(jq -er '.endpoint' <<< "$registry_namespace")" == "$SCW_REGISTRY_ENDPOINT" \
            && "$(jq -er '.is_public' <<< "$registry_namespace")" == "false" ]] || {
            echo "::error::Unexpected orchestration registry namespace"
            exit 1
          }

          container="$(scw container container get "$SCW_CONTAINER_ID" \
            region="$SCW_REGION" \
            -o json)"
          [[ "$(jq -er '.name' <<< "$container")" == "$SCW_CONTAINER_NAME" \
            && "$(jq -er '.namespace_id' <<< "$container")" == "$SCW_NAMESPACE_ID" ]] || {
            echo "::error::Unexpected demo orchestration container"
            exit 1
          }
          for key in \
            REDIS_URL \
            PLE_WEBHOOK_SECRET \
            CLIENT_SECRET \
            SENTRY_DSN \
            BULLBOARD_PASSWORD \
            WILLIE_API_TOKEN \
            ORANGE_LIVE_OBJECTS_API_KEY; do
            if ! jq -e --arg key "$key" \
              '(.secret_environment_variables // {}) | has($key)' \
              <<< "$namespace" >/dev/null \
              && ! jq -e --arg key "$key" \
              '(.secret_environment_variables // {}) | has($key)' \
              <<< "$container" >/dev/null; then
              echo "::error::Missing demo orchestration secret: $key"
              exit 1
            fi
          done
          client_id="$(jq -r '.environment_variables.CLIENT_ID // empty' <<< "$container")"
          if [[ -z "$client_id" ]]; then
            client_id="$(jq -r '.environment_variables.CLIENT_ID // empty' <<< "$namespace")"
          fi
          [[ "$client_id" == sa_* ]] || {
            echo "::error::Missing or invalid demo orchestration CLIENT_ID"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push demo image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          build-args: |
            ENV_NAME=demo
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo-${{ github.sha }}
          cache-from: type=gha,scope=orchestration-demo
          cache-to: type=gha,mode=max,scope=orchestration-demo


      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan exact candidate image before any deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          bash .github/scripts/scan-image.sh "$IMAGE_REF"
          bash .github/scripts/smoke-image.sh "$IMAGE_REF"

      - name: Retain image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ github.run_id }}
          path: .artifacts/security/image-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy immutable demo image
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ env.SCW_EXPECTED_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ env.SCW_EXPECTED_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: node .github/scripts/deploy-container.mjs "$SCW_CONTAINER_ID" /health

      - name: Publish environment alias only after verified deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          ALIAS_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo
        run: docker buildx imagetools create --tag "$ALIAS_REF" "$IMAGE_REF"
