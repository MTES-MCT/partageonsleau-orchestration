name: Deploy (prod) to Scaleway

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-orchestration
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.candidate.outputs.image }}

    env:
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      IMAGE_TAG: prod
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_PROD_NAMESPACE_ID: fa4179ac-8658-4440-963b-66d669a452d5
      SCW_PROD_CONTAINER_ID: ${{ secrets.SCW_PROD_CONTAINER_ID }}
      SCW_PROD_PRIVATE_NETWORK_ID: ${{ vars.SCW_PROD_PRIVATE_NETWORK_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Validate prod CI configuration
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONFIGURED_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_CONFIGURED_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONFIGURED_CONTAINER_ID: ${{ secrets.SCW_PROD_CONTAINER_ID }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-container.mjs --check prod
          [[ "$SCW_PROD_PRIVATE_NETWORK_ID" == "3a4a5621-4e6a-4195-b202-af3fc351e81c" ]] || {
            echo "::error::Unexpected prod private network configuration"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push immutable candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          build-args: |
            ENV_NAME=${{ env.IMAGE_TAG }}
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:prod-${{ github.sha }}
          cache-from: type=gha,scope=orchestration-prod
          cache-to: type=gha,mode=max,scope=orchestration-prod


      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan exact candidate image before any deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          bash .github/scripts/scan-image.sh "$IMAGE_REF"
          bash .github/scripts/smoke-image.sh "$IMAGE_REF"

      - name: Retain image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ github.run_id }}
          path: .artifacts/security/image-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Export verified immutable image
        id: candidate
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs'
          import {assertImmutableImage} from './.github/scripts/deploy-container.mjs'
          const repository = process.env.SCW_REGISTRY_ENDPOINT + '/' + process.env.SCW_IMAGE_NAME
          assertImmutableImage(process.env.IMAGE_REF, repository)
          appendFileSync(process.env.GITHUB_OUTPUT, 'image=' + process.env.IMAGE_REF + '\n')
          NODE

  deploy:
    needs: [quality, image]
    if: ${{ success() && needs.quality.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    env:
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      IMAGE_TAG: prod
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_PROD_NAMESPACE_ID: fa4179ac-8658-4440-963b-66d669a452d5
      SCW_PROD_CONTAINER_ID: ${{ secrets.SCW_PROD_CONTAINER_ID }}
      SCW_PROD_PRIVATE_NETWORK_ID: ${{ vars.SCW_PROD_PRIVATE_NETWORK_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Validate prod CI configuration
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONFIGURED_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_CONFIGURED_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONFIGURED_CONTAINER_ID: ${{ secrets.SCW_PROD_CONTAINER_ID }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-container.mjs --check prod
          [[ "$SCW_PROD_PRIVATE_NETWORK_ID" == "3a4a5621-4e6a-4195-b202-af3fc351e81c" ]] || {
            echo "::error::Unexpected prod private network configuration"
            exit 1
          }

      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund

      - name: Install deps
        run: npm ci

      - name: Install Scaleway CLI
        run: bash .github/scripts/install-scw.sh

      - name: Validate Scaleway prod resource ownership
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: |
          set -euo pipefail
          namespace="$(scw container namespace get "$SCW_PROD_NAMESPACE_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.project_id' <<< "$namespace")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$namespace")" == "prod-partageons-leau" ]] || {
            echo "::error::Unexpected prod namespace"
            exit 1
          }
          network="$(scw vpc private-network get "$SCW_PROD_PRIVATE_NETWORK_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.project_id' <<< "$network")" == "$SCW_EXPECTED_PROJECT_ID" \
            && "$(jq -er '.name' <<< "$network")" == "partageonsleau-prod-pn" \
            && "$(jq -er '.vpc_id' <<< "$network")" == "cdee708c-cc94-4a7b-a8cd-6307173d38ac" \
            && "$(jq -er '.region' <<< "$network")" == "$SCW_REGION" ]] || {
            echo "::error::Unexpected prod private network"
            exit 1
          }
          container="$(scw container container get "$SCW_PROD_CONTAINER_ID" region="$SCW_REGION" -o json)"
          [[ "$(jq -er '.name' <<< "$container")" == "prod-orchestration" \
            && "$(jq -er '.namespace_id' <<< "$container")" == "$SCW_PROD_NAMESPACE_ID" \
            && "$(jq -er '.private_network_id' <<< "$container")" == "$SCW_PROD_PRIVATE_NETWORK_ID" \
            && "$(jq -er '.min_scale' <<< "$container")" == "1" ]] || {
            echo "::error::Unexpected prod orchestration container"
            exit 1
          }
          client_id="$(jq -er '.environment_variables.CLIENT_ID' <<< "$container")"
          ple_base_url="$(jq -er '.environment_variables.PLE_BASE_URL' <<< "$container")"
          [[ "$client_id" == sa_* && "$ple_base_url" == https://* ]] || {
            echo "::error::Missing or invalid existing PLE connection configuration"
            exit 1
          }
          for key in REDIS_URL PLE_WEBHOOK_SECRET CLIENT_SECRET SENTRY_DSN \
            BULLBOARD_PASSWORD WILLIE_API_TOKEN ORANGE_LIVE_OBJECTS_API_KEY; do
            jq -e -s --arg key "$key" '
              any(.[];
                ((.secret_environment_variables // {}) | has($key)) or
                ((.environment_variables[$key] // "") | length > 0)
              )
            ' <(printf '%s' "$namespace") <(printf '%s' "$container") >/dev/null || {
              echo "::error::Missing orchestration configuration: $key"
              exit 1
            }
          done

          tls_identity="$(jq -er '.environment_variables.REDIS_TLS_IDENTITY // .environment_variables.REDIS_HOST_OVERRIDE // empty' <<< "$container")"
          TLS_CERT_IDENTITY="$tls_identity" node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {X509Certificate} from 'node:crypto'
          import {readFileSync} from 'node:fs'
          import {getRedisTlsOptions} from './src/queues/redis-url.ts'
          const pem = readFileSync('deploy/certs/prod/redis-ca.pem', 'utf8')
          // CI does not need the Redis credentials. Runtime validates the real URL scheme.
          const options = getRedisTlsOptions(pem, {
            REDIS_URL: 'rediss://localhost',
            REDIS_TLS_IDENTITY: process.env.TLS_CERT_IDENTITY,
          })
          assert.ok(options?.checkServerIdentity, 'Missing Redis certificate identity')
          const certificates = [...pem.matchAll(/-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----/g)]
            .map(([value]) => new X509Certificate(value))
          assert.ok(certificates.length, 'Missing Redis certificates')
          for (const certificate of certificates) {
            assert.ok(Date.parse(certificate.validFrom) <= Date.now(), 'Redis certificate not yet valid')
            assert.ok(Date.parse(certificate.validTo) > Date.now() + 86_400_000, 'Redis certificate expires too soon')
          }
          assert.ok(certificates.some(certificate => !options.checkServerIdentity('', certificate.toLegacyObject())), 'Redis certificate identity mismatch')
          NODE
          openssl verify -CAfile deploy/certs/prod/redis-ca.pem deploy/certs/prod/redis-ca.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Require idle orchestration queues before deployment
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          current="$(scw container container get "$SCW_CONTAINER_ID" region="$SCW_REGION" -o json)"
          # Refuse to redeploy while either orchestration queue has runnable work.
          # This read-only check does not lock the queues or eliminate later races.
          printf '%s' "$current" | node --import tsx --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {assertRemoteOrchestrationIdle} from "./src/network/deployment-idle.ts";
            try {
              const container = JSON.parse(readFileSync(0, "utf8"));
              await assertRemoteOrchestrationIdle({
                endpoint: container.public_endpoint,
                expectedHostname: "prodpartageonsleau02a6cumu-prod-orchestration.functions.fnc.fr-par.scw.cloud",
                password: container.environment_variables.BULLBOARD_PASSWORD,
              });
              console.log("Orchestration queues idle at deployment preflight");
            } catch {
              console.error("::error::Orchestration queue preflight failed; deployment refused");
              process.exitCode = 1;
            }
          '

      - name: Deploy and verify production container
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          IMAGE_REF: ${{ needs.image.outputs.image }}
        run: node .github/scripts/deploy-container.mjs "$SCW_CONTAINER_ID" /health

      - name: Publish environment alias only after verified deployment
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}
          ALIAS_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:prod
        run: docker buildx imagetools create --tag "$ALIAS_REF" "$IMAGE_REF"
